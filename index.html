<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Young Life · Sacramento County — Ministry Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ─── MASTHEAD ─────────────────────────────────────────────────── -->
<header class="masthead">
  <div class="brand">
    <img class="brand-mark-img" src="yl-logo.png" alt="Young Life">
    <div class="brand-text">
      <div class="brand-name">Sacramento County <em style="font-style:italic;color:var(--ink-3)">·</em> Ministry Map</div>
      <div class="brand-eyebrow">Young Life Field Atlas</div>
    </div>
  </div>

  <div class="mast-divider"></div>

  <div class="mast-search">
    <svg class="s-ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="9" r="6"/><path d="M15 15l3 3"/></svg>
    <input id="searchInput" type="text" placeholder="Search schools, districts…" autocomplete="off">
    <button id="searchClear" class="s-clear" title="Clear">×</button>
  </div>

  <div class="filters" id="filterGroup">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="younglife">YL</button>
    <button class="filter-btn" data-filter="wyldlife">Wyldlife</button>
    <button class="filter-btn" data-filter="college">College</button>
    <button class="filter-btn" data-filter="ylone">YL One</button>
    <button class="filter-btn" data-filter="capernaum">Capernaum</button>
  </div>

  <div class="mast-spacer"></div>

  <div class="sync-status"><span class="sync-dot"></span>Live</div>
  <div class="mast-divider"></div>
  <button id="boundaryBtn" class="ghost-btn">Districts</button>
  <button id="compareBtn" class="ghost-btn" disabled>Compare</button>
</header>

<!-- ─── VISION STRIP ─────────────────────────────────────────────── -->
<div class="vision-strip">
  <div class="v-item v-active">
    <span class="v-num" id="vsActive">—</span>
    <div class="v-meta">
      <div class="v-label">Active ministries</div>
      <div class="v-sub" id="vsActiveStudents">— students reached</div>
    </div>
  </div>

  <div class="v-arrow">→</div>

  <div class="v-item v-target">
    <span class="v-num" id="vsTarget">—</span>
    <div class="v-meta">
      <div class="v-label">Target schools</div>
      <div class="v-sub" id="vsTargetStudents">— more to reach</div>
    </div>
  </div>

  <div class="v-tagline">Every kid. Every school. Every district.</div>

  <div class="v-legend">
    <div class="leg-item"><span class="leg-dot f leg-yl"></span>YL</div>
    <div class="leg-item"><span class="leg-dot f leg-wl"></span>Wyldlife</div>
    <div class="leg-item"><span class="leg-dot f leg-col"></span>College</div>
    <div class="leg-item"><span class="leg-dot f leg-yl1"></span>YL One</div>
    <div class="leg-item"><span class="leg-dot f leg-cap"></span>Capernaum</div>
    <div class="leg-item"><span class="leg-dot leg-tgt"></span>Target</div>
  </div>
</div>

<!-- ─── MAP + SIDEBAR + COMPARE ─────────────────────────────────── -->
<main class="map-shell">
  <div id="map"></div>

  <aside id="sidebar">
    <div id="sidebarContent"></div>
  </aside>

  <section id="comparePanel">
    <div class="cmp-header">
      <h2>School Comparison <small>Best / worst per metric</small></h2>
      <div class="cmp-btns">
        <button id="cmpClear">Clear All</button>
        <button id="cmpClose">× Close</button>
      </div>
    </div>
    <div class="cmp-body" id="cmpBody">
      <div class="cmp-empty">Add at least 2 schools to compare.</div>
    </div>
  </section>
</main>

<!-- ─── TOOLTIP ─────────────────────────────────────────────────── -->
<div id="tooltip"></div>

<!-- ─── STAFF CARD ──────────────────────────────────────────────── -->
<div id="staffCard" class="staff-card hidden">
  <button id="staffCardClose" class="staff-card-close">×</button>
  <div class="staff-info">
    <div class="staff-name" id="staffName"></div>
    <div class="staff-title" id="staffTitle"></div>
    <a class="staff-link staff-phone" id="staffPhone" href="#">
      <svg viewBox="0 0 20 20" fill="currentColor"><path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z"/></svg>
      <span id="staffPhoneText"></span>
    </a>
    <a class="staff-link staff-email" id="staffEmail" href="#">
      <svg viewBox="0 0 20 20" fill="currentColor"><path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/><path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/></svg>
      <span id="staffEmailText"></span>
    </a>
  </div>
</div>

<!-- ─── SCRIPTS ─────────────────────────────────────────────────── -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js"></script>
<script src="staff.js"></script>
<script src="app.js"></script>
</body>
</html>
